<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sign-Lingo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fbff 0%, #e8f4fc 50%, #dceef8 100%);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #FFFBF7;
            z-index: 10;
            border-right: 1px solid #e0e0e0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #e8f8f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .logo-subtitle {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: #5f6368;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: #FDF8F3;
            color: #1a1a2e;
        }

        .nav-link.active {
            background: #e8f8f0;
            color: #2ECC71;
        }

        .nav-icon {
            font-size: 18px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            background: none;
            color: #e74c3c;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fee2e2;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .breadcrumb {
            color: #7f8c8d;
            font-size: 14px;
        }

        .breadcrumb span {
            color: #1a1a2e;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }

        .date-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #FFFBF7;
            border: 1px solid #E8E0D8;
            border-radius: 8px;
            font-size: 14px;
            color: #5f6368;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #FFFBF7;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #E8E0D8;
            position: relative;
            z-index: 1;
        }

        .stat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            background: #e8f8f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .stat-label {
            font-size: 14px;
            color: #2ECC71;
            font-weight: 500;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a2e;
        }

        /* Chart Section */
        .chart-section {
            background: #FFFBF7;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #E8E0D8;
            position: relative;
            z-index: 1;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .chart-subtitle {
            font-size: 13px;
            color: #7f8c8d;
        }

        .chart-legend {
            display: flex;
            gap: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #5f6368;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .legend-dot.green { background: #2ECC71; }
        .legend-dot.gray { background: #bdc3c7; }

        .chart-canvas-wrapper {
            position: relative;
            height: 280px;
        }

        .chart-canvas-wrapper canvas {
            width: 100%;
            height: 100%;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🤟</div>
            <div>
                <div class="logo-text">Sign-Lingo</div>
                <div class="logo-subtitle">Admin Portal</div>
            </div>
        </div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link active">
                    <span class="nav-icon">📊</span>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/users" class="nav-link">
                    <span class="nav-icon">👥</span>
                    Users
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/top-performers" class="nav-link">
                    <span class="nav-icon">🏆</span>
                    Top Performers
                </a>
            </li>
            <li class="nav-item">
                <a href="/admin/feedback" class="nav-link">
                    <span class="nav-icon">💬</span>
                    Feedback
                </a>
            </li>
        </ul>

        <button class="logout-btn" onclick="logout()">
            <span>🚪</span>
            Logout
        </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <div>
                <h1 class="page-title">Dashboard Overview</h1>
                <p class="page-subtitle">Welcome back, get an overview of your platform metrics.</p>
            </div>
            <select class="date-filter" id="periodFilter" style="cursor: pointer; border: 1px solid #E8E0D8; padding: 8px 16px; border-radius: 8px; background: #FFFBF7; color: #5f6368; font-size: 14px;">
                <option value="all" selected>📅 All Time</option>
                <option value="7days">📅 Last 7 Days</option>
                <option value="30days">📅 Last 30 Days</option>
                <option value="thisMonth">📅 This Month</option>
            </select>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">🎓</div>
                    <span class="stat-label">Total Users</span>
                </div>
                <div class="stat-value" id="totalStudents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">📝</div>
                    <span class="stat-label">Quizzes Taken</span>
                </div>
                <div class="stat-value" id="quizzesTaken">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">⚡</div>
                    <span class="stat-label">Active Today</span>
                </div>
                <div class="stat-value" id="activeToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">📬</div>
                    <span class="stat-label">Pending Feedback</span>
                </div>
                <div class="stat-value" id="pendingFeedback">0</div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="chart-section">
            <div class="chart-header">
                <div>
                    <h3 class="chart-title">User Growth</h3>
                    <p class="chart-subtitle">Last 30 Days performance</p>
                </div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-dot green"></div>
                        New Users
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot gray"></div>
                        Returning
                    </div>
                </div>
            </div>
            <div class="chart-canvas-wrapper">
                <canvas id="growthChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        // Check if user is logged in
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/admin';
        }

        // Fetch dashboard stats
        async function fetchStats() {
            try {
                const period = document.getElementById('periodFilter').value;
                const response = await fetch(`/admin/api/stats?period=${period}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalStudents').textContent = data.total_students || 0;
                    document.getElementById('quizzesTaken').textContent = data.quizzes_taken || 0;
                    document.getElementById('activeToday').textContent = data.active_today || 0;
                    document.getElementById('pendingFeedback').textContent = data.pending_feedback || 0;
                } else if (response.status === 401) {
                    logout();
                }
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        // ---- Grouped Bar Chart ----
        async function fetchGrowthChart() {
            try {
                const response = await fetch('/admin/api/user-growth', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return;
                const data = await response.json();
                drawBarChart(data.weeks || []);
            } catch (e) {
                console.error('Growth chart error:', e);
            }
        }

        function drawBarChart(weeks) {
            const canvas = document.getElementById('growthChart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const W = rect.width;
            const H = rect.height;

            ctx.clearRect(0, 0, W, H);
            if (!weeks.length) return;

            const newData = weeks.map(w => w.new_users);
            const retData = weeks.map(w => w.returning_users);
            const labels = weeks.map(w => w.label);
            const maxVal = Math.max(...newData, ...retData, 1);

            const padL = 50, padR = 20, padT = 30, padB = 50;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const n = weeks.length;

            // Horizontal grid lines + Y axis labels
            const steps = Math.min(maxVal, 5);
            ctx.font = `${12 * dpr / dpr}px Inter, sans-serif`;
            for (let i = 0; i <= steps; i++) {
                const val = Math.round(maxVal / steps * i);
                const y = padT + chartH - (val / maxVal) * chartH;
                ctx.beginPath();
                ctx.strokeStyle = '#eef0f2';
                ctx.lineWidth = 1;
                ctx.moveTo(padL, y);
                ctx.lineTo(padL + chartW, y);
                ctx.stroke();
                ctx.fillStyle = '#95a5a6';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(val, padL - 8, y);
            }

            // Draw grouped bars
            const groupW = chartW / n;
            const barPad = groupW * 0.15;
            const barW = (groupW - barPad * 2) / 2 - 3;
            const GREEN = '#2ECC71';
            const GRAY = '#bdc3c7';
            const GREEN_LIGHT = '#a8f0c8';
            const GRAY_LIGHT = '#e8ecee';

            weeks.forEach((week, i) => {
                const groupX = padL + i * groupW + barPad;
                const x1 = groupX;           // New users bar
                const x2 = groupX + barW + 3; // Returning bar

                function drawBar(x, value, color, lightColor) {
                    const barH = (value / maxVal) * chartH;
                    const y = padT + chartH - barH;

                    // Shadow / base
                    ctx.fillStyle = lightColor;
                    ctx.beginPath();
                    ctx.roundRect(x, padT, barW, chartH, 4);
                    ctx.fill();

                    // Actual bar
                    if (value > 0) {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.roundRect(x, y, barW, barH, [4, 4, 0, 0]);
                        ctx.fill();

                        // Value label on top
                        ctx.fillStyle = color;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.font = 'bold 13px Inter, sans-serif';
                        ctx.fillText(value, x + barW / 2, y - 4);
                    }
                }

                drawBar(x1, week.new_users, GREEN, GREEN_LIGHT);
                drawBar(x2, week.returning_users, GRAY, GRAY_LIGHT);

                // X axis label
                const labelX = groupX + barW + 1.5;
                ctx.fillStyle = '#5f6368';
                ctx.font = '12px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(week.label, labelX, padT + chartH + 10);
            });
        }

        // Logout function
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/admin';
        }

        // Filter change handler
        document.getElementById('periodFilter').addEventListener('change', fetchStats);

        // Load stats & chart on page load
        fetchStats();
        fetchGrowthChart();

        // Auto-refresh every 30 seconds so stats stay current
        setInterval(fetchStats, 30000);
        setInterval(fetchGrowthChart, 30000);

        // Redraw chart on resize
        window.addEventListener('resize', fetchGrowthChart);
    </script>
</body>
</html>
